<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Client</title>
    <script src="smartphone_client.js" defer></script>
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="smartphone_client.css">
</head>

<body>
    <header>
        <img id="header-logo" src="img/ewk_logo.png">
        <span id="header-title">Edirom-Mobile</span>
        <span id="header-connection-status"></span>
    </header>
    <h1>Smartphone Client</h1>
    <p id="server-connection-status" class="disconnected">SERVER: Not Connected</p>
    <p id="session-connection-status" class="disconnected">SESSION: Not Connected</p>
    <div id="alerts-container" class="hidden">
        <p id="alert"></p>
    </div>
    <div id="start-scan-btn-container">
        <button id="start-session-scan-btn" class="hidden">
            <span class="svg-container">qr_code_scanner</span>
            <span class="svg-container">devices</span>
            <p>Scanne Sitzungscode</p>
        </button>
        <button id="start-page-scan-btn" class="hidden">
            <span class="svg-container">qr_code_scanner</span>
            <span class="svg-container">auto_stories</span>
            <p>Scanne Seitencode</p>
        </button>
    </div>
    <div id="reader-container" class="hidden">
        <div id="reader"></div>
        <p id="scan-target-info">Scanne den Sitzungscode</p>
    </div>
</body>

</html>
