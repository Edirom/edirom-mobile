<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Client</title>
    <script src="smartphone_client.js" defer></script>
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="smartphone_client.css">
</head>


<body>
    <header>
        <img id="header-logo" src="img/ewk_logo.png">
        <span id="header-title">Edirom-Mobile</span>
        <span id="header-connection-status" data-connection-status="disconnected"></span>
    </header>
    <footer>
        <div id="footer-burger-menu"><span class="svg-container">menu</span></div>
        <div id="context-container">
            <div id="footer-arrow-left"><span class="svg-container">keyboard_arrow_left</span></div>
            <div id="current-context">Lieder I S. <span id="current-context-pages">X-Y</span></div>
            <div id="footer-arrow-right"><span class="svg-container">keyboard_arrow_right</span></div>
        </div>
        <div id="new-qr-code-scan-btn">
            <span class="svg-container">qr_code_scanner</span>
        </div>
        <div id="new-qr-code-scan-btn-border">
        </div>
    </footer>
    <!-- scanNewQrCodePopover -->
    <div popover="manual" id="scanNewQrCodePopover">
        <div class="explanation-container">
            <h1>Neuen QR-Code scannen</h1>
        </div>
        <div class="reader-container">
            <div id="page-reader" class="reader"></div>
        </div>
    </div>
    <div id="content-container">
        <div id="alerts-container" class="display-none">
            <p id="alert"></p>
        </div>

        <!-- loginPage -->
        <div class="page display-none" id="loginPage">
            <h1>Bitte einloggen:</h1>
            <div class="formContainer">
                <form>
                    <label for="loginName">Benutzername:</label><br>
                    <input type="text" id="loginName" name="name"><br>
                    <label for="loginPassword">Passwort:</label><br>
                    <input type="password" id="loginPassword" name="password">
                </form>
                <button id="loginPageSubmit">Login</button>
            </div>
            <h1 id="loginAdvertisementHeader">Noch kein Subskribent?</h1>
            <p id="loginAdvertisementText"><a href="#">▶ Zugang beschaffen</a></p>
            <img id="schottLogo" src="https://upload.wikimedia.org/wikipedia/de/thumb/a/a5/Schott_Music_logo.svg/1920px-Schott_Music_logo.svg.png" height="60px">
        </div>

        <!-- loginSuccessPage -->
        <div class="page display-none" id="loginSuccessPage">
            <h1>Willkommen</h1>
            <h1>Sie haben sich erfolgreich eingeloggt!</h1>
            <button id="loginSuccessContinue">Fortfahren</button>
        </div>
    </div>
</body>

</html>
