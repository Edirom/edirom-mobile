<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Client</title>
    <script src="main.js" defer></script>
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="styles.css">
</head>


<body>
    <header>
        <div id="header-burger-menu"><span class="svg-container"></span></div>
        <span id="header-edition-name">Edirom-Mobile</span>
        <span id="header-connection-status" data-connection-status="disconnected"></span>
    </header>
    <div id="content-container">
        <div id="alerts-container" class="display-none">
            <p id="alert"></p>
        </div>
    </div>
    <footer id="footer">
        <div id="context-container">
            <div id="footer-arrow-left"><span class="svg-container">keyboard_arrow_left</span></div>
            <div id="current-context">Robin Hood S. <span id="current-context-pages">X-Y</span></div>
            <div id="footer-arrow-right"><span class="svg-container">keyboard_arrow_right</span></div>
        </div>
        <div id="new-qr-code-scan-btn">
            <span class="svg-container">qr_code_scanner</span>
        </div>
        <div id="new-qr-code-scan-btn-border">
        </div>
    </footer>
    <!-- scanNewQrCodePopover -->
    <div popover="manual" id="scanNewQrCodePopover">
        <div class="explanation-container">
            <h1>Neuen QR-Code scannen</h1>
        </div>
        <div class="reader-container">
            <div id="page-reader" class="reader"></div>
        </div>
    </div>
</body>

</html>
