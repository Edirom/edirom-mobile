<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edirom Mobile</title>
    <!-- Config System -->
    <script src="env-config.js"></script>
    <script src="resources/js/main.js" type="module"></script>
    <script defer src="resources/web-components/edirom-concordance-navigator/concordanceNavigatorElement.js" type="module"></script>
    <script defer src="resources/web-components/edirom-navigator/navigator.js" type="module"></script>
    <script defer src="resources/web-components/edirom-annotation-view/edirom-annotation-view.js" type="module"></script>
    <script defer src="resources/web-components/edirom-text-viewer/edirom-text-viewer.js" type="module"></script>
    <script defer src="resources/web-components/edirom-image-viewer/edirom-image-viewer.js" type="module"></script>
    <script defer src="resources/web-components/edirom-videoplayer/videoplayer.js" type="module"></script>
    <script defer src="resources/web-components/edirom-controls/edirom-control-bar.js" type="module"></script>
    <script defer src="resources/web-components/edirom-controls/edirom-spacer-widget.js" type="module"></script>
    <script defer src="resources/web-components/edirom-controls/edirom-button-widget.js" type="module"></script>
    <script defer src="resources/web-components/edirom-controls/edirom-spin-box-widget.js" type="module"></script>
    <!-- html5-qrcode must be a plain (non-module) script so that its var declarations
         become globals on window. Loaded with type="module" the var scoping breaks
         window.__Html5QrcodeLibrary__ and Html5Qrcode is never defined globally. -->
    <script defer src="resources/web-components/edirom-qr-code-scanner/resources/html5-qrcode.min.js"></script>
    <script defer src="resources/web-components/edirom-qr-code-scanner/edirom-qr-code-scanner.js" type="module"></script>
    <link rel="stylesheet" href="resources/css/styles.css">
</head>


<body>
    <header>
        <div id="header-burger-menu"><edirom-icon name="menu" size="2rem"></edirom-icon></div>
        <div id="header-edition-name">Edirom Mobile</div>
        <div id="header-status-container">
            <div id="header-connection-status" data-connection-status="disconnected"></div>
        </div>
        <nav id="header-menu" class="header-menu" aria-label="Hauptmenü" aria-hidden="true"></nav>
    </header>
    <div id="content-container">
</div>
    <div id="alerts-container" class="display-none">
        <p id="alert"></p>
    </div>
    <footer id="footer">
    </footer>
    <!-- scanNewQrCodePopover -->
    <div popover="manual" id="scanNewQrCodePopover">
        <div class="explanation-container">
            <h1>Neuen QR-Code scannen</h1>
        </div>
        <div class="reader-container">
            <div id="page-reader" class="reader"></div>
        </div>
    </div>
</body>

</html>
