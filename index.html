<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smartphone Client</title>
    <!-- Config System -->
    <script src="env-config.js"></script>
    <script src="resources/js/main.js" type="module"></script>
    <script defer src="resources/web-components/edirom-concordance-navigator/concordanceNavigatorElement.js" type="module"></script>
    <script defer src="resources/web-components/edirom-navigator/navigator.js" type="module"></script>
    <script defer src="resources/web-components/edirom-annotation-view/edirom-annotation-view.js" type="module"></script>
    <script src="resources/js/html5-qrcode.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="resources/css/styles.css">
</head>


<body>
    <header>
        <div id="header-burger-menu"><edirom-icon name="menu" size="2rem"></edirom-icon></div>
        <div id="header-edition-name">Edirom-Mobile</div>
        <div id="header-status-container">
            <div id="header-connection-status" data-connection-status="disconnected"></div>
        </div>
        <nav id="header-menu" class="header-menu" aria-label="Hauptmenü" aria-hidden="true">
            <ul>
                <li><a href="#home">Startseite</a></li>
                <li><a href="#aktuell">Aktuelles</a></li>
                <li><a href="#sammlung">Sammlung</a></li>
                <li><a href="#werkzeuge">Werkzeuge</a></li>
                <li><a href="#kontakt">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <div id="content-container">
</div>
    <div id="alerts-container" class="display-none">
        <p id="alert"></p>
    </div>
    <footer id="footer">
        <edirom-concordance-navigator layout-mode="mobile"></edirom-concordance-navigator>
    </footer>
    <!-- scanNewQrCodePopover -->
    <div popover="manual" id="scanNewQrCodePopover">
        <div class="explanation-container">
            <h1>Neuen QR-Code scannen</h1>
        </div>
        <div class="reader-container">
            <div id="page-reader" class="reader"></div>
        </div>
    </div>
</body>

</html>
