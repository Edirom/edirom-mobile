version: "3.7"

services:
  edirom-mobile:
    image: dennisfriedl/edirom-mobile:action-test
    ports:
      - "8082:80"
    depends_on:
      - edirom-ws-server
    environment:
      - SERVER_URL=ws://localhost:8081
  edirom-ws-server:
    image: dennisfriedl/edirom-ws-server:action-test
    ports:
      - "8081:3000"
   